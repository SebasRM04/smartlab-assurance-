# ==========================================================
# Configuracion exclusiva para tests: usa H2 en memoria,
# distinta de la base de datos persistente en archivo que usa
# la aplicacion real (src/main/resources/application.properties).
# Esto evita que los tests dependan de datos previos y garantiza
# que cada ejecucion de "mvn test" arranque desde una base limpia.
# ==========================================================

spring.datasource.url=jdbc:h2:mem:smartlabdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT: secreto propio para tests (no es sensible, solo de desarrollo/pruebas)
app.jwt.secret=smartlab-assurance-clave-secreta-de-pruebas-utp-100000st61-no-usar-en-produccion
app.jwt.expiration-ms=86400000

# Los tests arrancan solo con roles + admin (DataSeeder). El escenario demo
# ensuciaría métricas y asumiría ids de categoría que estos tests crean solos.
app.seed.datos-demo=false

# La carga masiva solo se activa en DatosMasivosSeederTest, con su propia base en memoria
app.seed.datos-masivos=false
