# --- Servidor ---
server.port=8080

# --- Base de datos MySQL ---
# Crear antes la base: CREATE DATABASE smartlab CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/smartlab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root

# --- JPA / Hibernate ---
# ddl-auto=update genera automaticamente las tablas a partir de las entidades @Entity
spring.jpa.hibernate.ddl-auto=update
# Apagado: la carga masiva de datos imprimiría miles de sentencias. Poner en true para depurar consultas.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Swagger UI (springdoc-openapi) ---
# Documentacion interactiva disponible en: http://localhost:8080/swagger-ui.html
# Especificacion OpenAPI en JSON disponible en: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# --- Seguridad: JWT ---
# IMPORTANTE: este secreto es solo para desarrollo/entrega academica.
# Antes de un despliegue real, se debe mover a una variable de entorno,
# nunca dejarlo escrito en el repositorio.
app.jwt.secret=smartlab-assurance-clave-secreta-academica-utp-100000st61-cambiar-en-produccion
# 24 horas, en milisegundos
app.jwt.expiration-ms=86400000

# --- Datos iniciales (DataSeeder) ---
# Usuario ADMINISTRADOR que se crea automaticamente la primera vez que arranca la aplicacion.
# Sirve para poder hacer el primer login y probar el resto de los endpoints.
# IMPORTANTE: solo para desarrollo/entrega academica; cambiar la contrasena antes de un despliegue real.
app.seed.admin-nombre=Administrador SmartLab
app.seed.admin-email=admin@smartlab.com
app.seed.admin-password=Admin123!

# Datos de prueba (DatosPruebaSeeder): equipos, reservas, prestamos, mantenimientos, incidencias
# y un usuario por rol (contrasena de todos: Demo123!). Poner en false para arrancar sin datos de ejemplo.
# Se cargan una sola vez. Para volver a empezar, vaciar la base smartlab y reiniciar.
app.seed.datos-demo=true

# Datos masivos (DatosMasivosSeeder): completa hasta 180 equipos y carga mas de 10 000 registros coherentes
# (reservas, prestamos, mantenimientos, historial, solicitudes rechazadas e incidencias).
# Se carga una sola vez. Para volver a empezar, vaciar la base smartlab y reiniciar.
app.seed.datos-masivos=true

# --- CORS: origenes del frontend (Angular) que pueden llamar a la API, separados por coma ---
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
